[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autorentledger"
version = "0.1.0"
description = "Local payment ingestion and payer identity resolution for AutoRentLedger"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.0,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
autorentledger = "autorentledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autorentledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
