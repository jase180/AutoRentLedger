{% extends "base.html" %}

{% block title %}{{ title }} | AutoRentLedger{% endblock %}

{% block content %}
  <section class="error-panel" aria-labelledby="error-title">
    <p class="eyebrow">Request could not be completed</p>
    <h1 id="error-title">{{ title }}</h1>
    <p>{{ message }}</p>
    {% if commands %}
      <p>Run:</p>
      {% for command in commands %}
        <code>{{ command }}</code>
      {% endfor %}
    {% endif %}
  </section>
{% endblock %}
