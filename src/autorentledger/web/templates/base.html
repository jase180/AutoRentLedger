<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AutoRentLedger{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="page-shell header-inner">
        <a class="brand" href="{{ url_for('web.root') }}">AutoRentLedger</a>
        {% if session.get("authenticated") is sameas true %}
          <nav class="site-nav" aria-label="Primary navigation">
            <a href="{{ url_for('web.root') }}"{% if active_page == "overview" %} aria-current="page"{% endif %}>Overview</a>
            <span aria-hidden="true">|</span>
            <a href="{{ url_for('web.attention') }}"{% if active_page == "attention" %} aria-current="page"{% endif %}>Attention</a>
            <span aria-hidden="true">|</span>
            <a href="{{ url_for('web.payments') }}"{% if active_page == "payments" %} aria-current="page"{% endif %}>Payments</a>
            <span aria-hidden="true">|</span>
            <a href="{{ url_for('web.obligations') }}"{% if active_page == "obligations" %} aria-current="page"{% endif %}>Obligations</a>
            <span aria-hidden="true">|</span>
            <a href="{{ url_for('web.allocation_plan') }}"{% if active_page == "allocation-plan" %} aria-current="page"{% endif %}>Allocation Plan</a>
          </nav>
          <form class="logout-form" method="post" action="{{ url_for('auth.logout') }}">
            <button class="link-button" type="submit">Sign out</button>
          </form>
        {% else %}
          <span class="local-label">Single-owner sign in</span>
        {% endif %}
      </div>
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
